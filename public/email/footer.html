<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Ivy &amp; Bough email footer</title><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:32px 16px;background:#F3EEE5;font-family:Arial,sans-serif;color:#2F2C27">
<div style="max-width:540px;margin:0 auto 16px"><button id="copy" type="button" style="padding:14px 26px;border:0;background:#2F2C27;color:#fff;font-size:14px;cursor:pointer">Copy footer</button></div>
<div id="sig" style="max-width:540px;margin:0 auto;padding:24px;background:#fff;box-sizing:border-box">
<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif"><tr><td style="padding:12px 0 0;border-top:1px solid #C4A265;font-size:11px;line-height:17px;color:#7A644F">
<a href="https://ivyandbough.com/privacy" style="color:#7A644F">Privacy Policy</a> &nbsp;|&nbsp; <a href="https://ivyandbough.com/terms-of-sale" style="color:#7A644F">Terms of Sale</a> &nbsp;|&nbsp; <a href="https://ivyandbough.com/terms" style="color:#7A644F">Website Terms</a> &nbsp;|&nbsp; <a href="https://ivyandbough.com/unsubscribe" style="color:#7A644F">Unsubscribe</a><br>
Ivy &amp; Bough is a trading name of Aurella Group Pty Ltd, ABN 70 649 742 423.<br>
This email is intended for the person it was sent to. If it reached you by mistake, please let us know and delete it.
</td></tr></table>
</div>
<script>
document.getElementById("copy").addEventListener("click",async function(){
  var btn=this,box=document.getElementById("sig").querySelector("table");
  try{await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([box.outerHTML],{type:"text/html"}),"text/plain":new Blob([box.innerText],{type:"text/plain"})})]);}
  catch(e){var r=document.createRange();r.selectNode(box);var c=getSelection();c.removeAllRanges();c.addRange(r);document.execCommand("copy");c.removeAllRanges();}
  btn.textContent="Copied";
});
</script>
</body></html>
