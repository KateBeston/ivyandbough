<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Ivy &amp; Bough email signature</title><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:32px 16px;background:#E9E4DB;font-family:Arial,sans-serif;color:#2F2C27">
<div style="max-width:600px;margin:0 auto 16px"><button id="copy" type="button" style="padding:14px 26px;border:0;background:#2F2C27;color:#fff;font-size:14px;cursor:pointer">Copy signature</button></div>
<div id="sig" style="max-width:600px;margin:0 auto;padding:24px;background:#fff;box-sizing:border-box">
<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;color:#2F2C27">
<tr><td style="font-size:14px;line-height:20px;font-weight:bold">The Ivy &amp; Bough team</td></tr>
<tr><td style="font-size:13px;line-height:20px"><a href="mailto:hello@ivyandbough.com" style="color:#2F2C27;text-decoration:none">hello@ivyandbough.com</a> &nbsp;|&nbsp; <a href="https://ivyandbough.com" style="color:#2F2C27;text-decoration:none">ivyandbough.com</a></td></tr>
</table>
</div>
<script>
document.getElementById("copy").addEventListener("click",async function(){
  var btn=this,box=document.getElementById("sig").querySelector("table");
  try{await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([box.outerHTML],{type:"text/html"}),"text/plain":new Blob([box.innerText],{type:"text/plain"})})]);}
  catch(e){var r=document.createRange();r.selectNode(box);var c=getSelection();c.removeAllRanges();c.addRange(r);document.execCommand("copy");c.removeAllRanges();}
  btn.textContent="Copied. Now paste it in";
});
</script>
</body></html>
